name: CI

on:
  push:
    branches: master
    tags:
      - 'v*'
  pull_request:
    branches: master

jobs:
  code_quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Lint with flake8
        run: |
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics --exclude ckan,ckanext

  test:
    strategy:
      matrix:
        include:
          # CKAN 2.9 is not tested here: it is end of life, and the Alpine based
          # ckan-dev:2.9 image cannot run the Node version used by current
          # GitHub runners ("Error relocating .../node: pthread_getname_np").
          - ckan-version: "2.10"
            solr-image: "ckan/ckan-solr:2.10-solr9"
          - ckan-version: "2.11"
            solr-image: "ckan/ckan-solr:2.11-solr9"
      fail-fast: false

    name: CKAN ${{ matrix.ckan-version }} extension test
    runs-on: ubuntu-latest
    container:
      image: ckan/ckan-dev:${{ matrix.ckan-version }}
      options: --user root

    services:
      solr:
        image: ${{ matrix.solr-image }}
      postgres:
        image: ckan/ckan-postgres-dev:${{ matrix.ckan-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:3

    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1

    steps:
      - uses: actions/checkout@v4

      - name: Install requirements
        run: |
          pip install -e .
          pip install -r dev-requirements.txt
          pip install pytest-cov
          # Point the test config at the CKAN core config inside the container
          sed -i -e 's/use = config:.*/use = config:\/srv\/app\/src\/ckan\/test-core.ini/' test.ini

      - name: Run all tests
        run: |
          pytest --ckan-ini=test.ini --cov=ckanext.issues --disable-warnings ckanext/issues/tests

      - name: Coveralls
        continue-on-error: true
        uses: AndreMiras/coveralls-python-action@develop
        with:
          parallel: true
          flag-name: CKAN ${{ matrix.ckan-version }} Unit Test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install setup requirements
        run: |
          python -m pip install --upgrade setuptools wheel twine
      - name: Build and package
        run: |
          python setup.py sdist bdist_wheel
          twine check dist/*
      - name: Publish package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  coveralls_finish:
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Coveralls Finished
      uses: AndreMiras/coveralls-python-action@develop
      with:
        parallel-finished: true
